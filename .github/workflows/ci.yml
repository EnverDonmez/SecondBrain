name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python scripts/install_locked.py --editable --extra dev
      - run: python -m ruff check second_brain tests scripts
      - run: python -m ruff format --check second_brain tests scripts
      - run: python -m mypy second_brain --ignore-missing-imports --check-untyped-defs
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - run: node --check second_brain/static/app.js
      - run: python scripts/scan_secrets.py
      - run: python -m pip_audit --format json --output reports/dependency-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: reports/
